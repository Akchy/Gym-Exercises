# Static hosting for closed/self-managed environments (AWS ECS/EKS, Azure Container Apps, on-prem).
# Terminate TLS at your load balancer (ALB / Application Gateway) or here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The full policy is a <meta> tag generated at build time (it includes your Supabase URL).
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /exercises/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  types {
    application/manifest+json webmanifest;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
